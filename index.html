<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugasku</title>
    <style>
      :root {
        --paper: #f7f4ee;
        --ink: #20241f;
        --muted: #847d6d;
        --line: #e4ddcc;
        --card: #ffffff;
        --user: #3f7d5c;
        --user-dark: #2c5a41;
        --user-soft: #e8f1ea;
        --admin: #4a4d86;
        --admin-dark: #34366a;
        --admin-soft: #eaeaf5;
        --danger: #b3432b;
        --danger-soft: #f6e5df;
        --urgent: #b3432b;
        --important: #c1832c;
        --normal: #5b8a6b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--paper);
        color: var(--ink);
        min-height: 100vh;
      }
      h1,
      h2,
      h3 {
        font-family: Georgia, "Iowan Old Style", serif;
        margin: 0;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
      }
      .hidden {
        display: none !important;
      }
      input,
      select,
      textarea {
        font-family: inherit;
      }

      /* ---------- Auth screen ---------- */
      #auth-screen {
        max-width: 380px;
        margin: 64px auto;
        padding: 0 20px;
      }
      #auth-screen h1 {
        font-size: 1.9rem;
        letter-spacing: -0.01em;
      }
      #auth-screen p.tag {
        color: var(--muted);
        margin: 6px 0 26px;
        font-size: 0.95rem;
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 5px;
      }
      .field input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        font-size: 0.95rem;
        background: white;
      }
      .field input:focus {
        outline: 2px solid var(--user);
        outline-offset: 1px;
      }
      #auth-error {
        color: var(--danger);
        font-size: 0.85rem;
        min-height: 18px;
        margin-bottom: 8px;
      }
      .btn-block {
        width: 100%;
        background: var(--user);
        color: white;
        padding: 12px;
        border-radius: 9px;
        font-size: 0.95rem;
        font-weight: 600;
      }
      .btn-block:hover {
        background: var(--user-dark);
      }
      #auth-toggle {
        margin-top: 16px;
        font-size: 0.88rem;
        color: var(--muted);
      }
      .btn-link {
        background: none;
        color: var(--user-dark);
        text-decoration: underline;
        font-size: inherit;
        padding: 0;
      }

      /* ---------- Shared app chrome ---------- */
      .wrap {
        max-width: 640px;
        margin: 0 auto;
        padding: 22px 18px 90px;
      }
      header.top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        gap: 12px;
      }
      header.top h1 {
        font-size: 1.4rem;
      }
      .badge-role {
        display: inline-block;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        padding: 2px 8px;
        border-radius: 20px;
        margin-left: 8px;
        vertical-align: middle;
      }
      .badge-role.admin {
        background: var(--admin-soft);
        color: var(--admin-dark);
      }
      .badge-role.user {
        background: var(--user-soft);
        color: var(--user-dark);
      }
      .sub {
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 2px;
      }
      .btn-ghost {
        background: transparent;
        color: var(--muted);
        font-size: 0.85rem;
        text-decoration: underline;
        padding: 4px;
      }

      /* ---------- User: add-task card ---------- */
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 20px;
      }
      .card input[type="text"],
      .card textarea,
      .card select,
      .card input[type="datetime-local"] {
        width: 100%;
        padding: 10px 11px;
        border: 1px solid var(--line);
        border-radius: 9px;
        font-size: 0.92rem;
        background: var(--paper);
        margin-bottom: 9px;
      }
      .card textarea {
        resize: vertical;
        min-height: 52px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .btn-add {
        background: var(--user);
        color: white;
        padding: 10px;
        border-radius: 9px;
        font-weight: 600;
        font-size: 0.92rem;
        width: 100%;
      }
      .btn-add:hover {
        background: var(--user-dark);
      }

      /* ---------- Stats strip ---------- */
      .stats {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
      }
      .stat {
        flex: 1;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
      }
      .stat .num {
        font-size: 1.5rem;
        font-family: Georgia, serif;
      }
      .stat .label {
        font-size: 0.75rem;
        color: var(--muted);
      }

      /* ---------- Tabs ---------- */
      .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }
      .tab-btn {
        background: none;
        padding: 9px 4px;
        margin-right: 16px;
        font-size: 0.92rem;
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      .tab-btn.active {
        color: var(--user-dark);
        border-bottom-color: var(--user);
        font-weight: 600;
      }

      /* ---------- Task cards ---------- */
      .task {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 13px 14px;
        margin-bottom: 10px;
      }
      .task.done {
        opacity: 0.55;
      }
      .task-top {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .task input[type="checkbox"] {
        margin-top: 3px;
        width: 18px;
        height: 18px;
        accent-color: var(--user);
        flex-shrink: 0;
      }
      .task-body {
        flex: 1;
        min-width: 0;
      }
      .task-text {
        font-size: 0.98rem;
        word-break: break-word;
      }
      .task.done .task-text {
        text-decoration: line-through;
      }
      .task-notes {
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 4px;
        white-space: pre-wrap;
      }
      .task-meta {
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 6px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .task-meta.overdue {
        color: var(--danger);
        font-weight: 600;
      }
      .priority-pill {
        font-size: 0.68rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 20px;
      }
      .priority-pill.urgent {
        background: #f6e2db;
        color: var(--urgent);
      }
      .priority-pill.important {
        background: #f7ecd8;
        color: var(--important);
      }
      .priority-pill.normal {
        background: #e6efe9;
        color: var(--normal);
      }
      .task-actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        justify-content: flex-end;
      }
      .icon-btn {
        background: var(--paper);
        border: 1px solid var(--line);
        padding: 5px 11px;
        border-radius: 7px;
        font-size: 0.78rem;
        color: var(--ink);
      }
      .icon-btn:hover {
        background: var(--line);
      }
      .icon-btn.danger {
        color: var(--danger);
      }
      .empty-state {
        text-align: center;
        color: var(--muted);
        padding: 44px 10px;
        font-size: 0.9rem;
      }

      /* ---------- Edit modal ---------- */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(20, 20, 15, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 50;
      }
      .modal {
        background: var(--card);
        border-radius: 14px;
        padding: 20px;
        max-width: 420px;
        width: 100%;
      }
      .modal h3 {
        margin-bottom: 14px;
      }
      .modal-actions {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }
      .modal-actions .icon-btn {
        flex: 1;
        text-align: center;
        padding: 9px;
      }

      /* ---------- Admin ---------- */
      #app-admin header.top h1 {
        color: var(--admin-dark);
      }
      .admin-stat .num {
        color: var(--admin-dark);
      }
      table.users {
        width: 100%;
        border-collapse: collapse;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        font-size: 0.85rem;
      }
      table.users th {
        text-align: left;
        background: var(--admin-soft);
        color: var(--admin-dark);
        padding: 9px 10px;
        font-size: 0.72rem;
        letter-spacing: 0.02em;
      }
      table.users td {
        padding: 9px 10px;
        border-top: 1px solid var(--line);
        vertical-align: top;
      }
      .status-pill {
        font-size: 0.68rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 20px;
      }
      .status-pill.active {
        background: var(--user-soft);
        color: var(--user-dark);
      }
      .status-pill.disabled {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .table-wrap {
        overflow-x: auto;
      }
      #app-user,
      #app-admin {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- ===================== AUTH ===================== -->
    <div id="auth-screen">
      <h1>Tugasku</h1>
      <p class="tag" id="auth-tagline">
        Masuk untuk mengelola tugas dan deadline Anda.
      </p>
      <div id="auth-error"></div>
      <div class="field">
        <label>Email</label
        ><input type="email" id="email-input" autocomplete="email" />
      </div>
      <div class="field">
        <label>Kata sandi</label
        ><input
          type="password"
          id="password-input"
          autocomplete="current-password"
        />
      </div>
      <button class="btn-block" id="auth-submit">Masuk</button>
      <div id="auth-toggle">
        Belum punya akun?
        <button class="btn-link" id="auth-switch">Daftar di sini</button>
      </div>
    </div>

    <!-- ===================== USER APP ===================== -->
    <div id="app-user">
      <div class="wrap">
        <header class="top">
          <div>
            <h1>Tugasku<span class="badge-role user">USER</span></h1>
            <div class="sub" id="user-email-label"></div>
          </div>
          <button class="btn-ghost" id="logout-btn-user">Keluar</button>
        </header>

        <div class="stats">
          <div class="stat">
            <div class="num" id="stat-aktif">0</div>
            <div class="label">Tugas aktif</div>
          </div>
          <div class="stat">
            <div class="num" id="stat-selesai">0</div>
            <div class="label">Selesai</div>
          </div>
          <div class="stat">
            <div class="num" id="stat-lewat">0</div>
            <div class="label">Lewat deadline</div>
          </div>
        </div>

        <div class="card">
          <input type="text" id="new-task-text" placeholder="Nama tugas" />
          <textarea
            id="new-task-notes"
            placeholder="Catatan (opsional)"
          ></textarea>
          <div class="grid2">
            <select id="new-task-priority">
              <option value="urgent">Sangat penting</option>
              <option value="important" selected>Penting</option>
              <option value="normal">Biasa</option>
            </select>
            <input type="datetime-local" id="new-task-deadline" />
          </div>
          <button class="btn-add" id="add-task-btn">Tambah tugas</button>
        </div>

        <div class="tabs">
          <button class="tab-btn active" data-tab="aktif">Aktif</button>
          <button class="tab-btn" data-tab="selesai">Selesai</button>
        </div>

        <div id="task-list"></div>
        <div class="empty-state" id="empty-state">Belum ada tugas di sini.</div>
      </div>
    </div>

    <!-- ===================== ADMIN APP ===================== -->
    <div id="app-admin">
      <div class="wrap">
        <header class="top">
          <div>
            <h1>Tugasku<span class="badge-role admin">ADMIN</span></h1>
            <div class="sub" id="admin-email-label"></div>
          </div>
          <button class="btn-ghost" id="logout-btn-admin">Keluar</button>
        </header>

        <div class="stats">
          <div class="stat admin-stat">
            <div class="num" id="admin-total-users">0</div>
            <div class="label">Total pengguna</div>
          </div>
          <div class="stat admin-stat">
            <div class="num" id="admin-total-tasks">0</div>
            <div class="label">Total tugas dibuat</div>
          </div>
          <div class="stat admin-stat">
            <div class="num" id="admin-active-today">0</div>
            <div class="label">Login 24 jam terakhir</div>
          </div>
        </div>

        <div class="card">
          <input
            type="text"
            id="admin-search"
            placeholder="Cari berdasarkan email..."
          />
        </div>

        <div class="table-wrap">
          <table class="users">
            <thead>
              <tr>
                <th>Email</th>
                <th>Daftar</th>
                <th>Login terakhir</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="user-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ===================== EDIT MODAL ===================== -->
    <div class="modal-overlay hidden" id="edit-overlay">
      <div class="modal">
        <h3>Edit tugas</h3>
        <input type="text" id="edit-text" placeholder="Nama tugas" />
        <textarea id="edit-notes" placeholder="Catatan (opsional)"></textarea>
        <div class="grid2">
          <select id="edit-priority">
            <option value="urgent">Sangat penting</option>
            <option value="important">Penting</option>
            <option value="normal">Biasa</option>
          </select>
          <input type="datetime-local" id="edit-deadline" />
        </div>
        <div class="modal-actions">
          <button class="icon-btn" id="edit-cancel">Batal</button>
          <button
            class="icon-btn"
            id="edit-save"
            style="
              background: var(--user);
              color: white;
              border-color: var(--user);
            "
          >
            Simpan
          </button>
        </div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
      import {
        getFirestore,
        collection,
        addDoc,
        onSnapshot,
        doc,
        updateDoc,
        deleteDoc,
        getDocs,
        getDoc,
        setDoc,
        query,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      // >>> GANTI DENGAN FIREBASE CONFIG ASLI ANDA <<<
      const firebaseConfig = {
        apiKey: "AIzaSyAa8NPTTgLAzHQkgvrzcFaNi2ZCpQ82kbE",
        authDomain: "tugas-saya-app.firebaseapp.com",
        projectId: "tugas-saya-app",
        storageBucket: "tugas-saya-app.firebasestorage.app",
        messagingSenderId: "59386857102",
        appId: "1:59386857102:web:d059f302249ac428b92bdf",
      };
      const APP_ID = "tugas-app-utama"; // harus sama dengan yang dipakai bot.js

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let isRegisterMode = false;
      let unsubTasks = null;
      let unsubUsers = null;
      let currentTab = "aktif";
      let cachedTasks = [];
      let editingTaskId = null;

      // ---------- Elements ----------
      const authScreen = document.getElementById("auth-screen");
      const appUser = document.getElementById("app-user");
      const appAdmin = document.getElementById("app-admin");
      const authError = document.getElementById("auth-error");
      const emailInput = document.getElementById("email-input");
      const passwordInput = document.getElementById("password-input");
      const authSubmit = document.getElementById("auth-submit");
      const authSwitch = document.getElementById("auth-switch");
      const authToggle = document.getElementById("auth-toggle");
      const authTagline = document.getElementById("auth-tagline");

      authSwitch.addEventListener("click", () => {
        isRegisterMode = !isRegisterMode;
        authSubmit.textContent = isRegisterMode ? "Daftar" : "Masuk";
        authTagline.textContent = isRegisterMode
          ? "Buat akun baru untuk mulai mengelola tugas Anda."
          : "Masuk untuk mengelola tugas dan deadline Anda.";
        authToggle.innerHTML = isRegisterMode
          ? 'Sudah punya akun? <button class="btn-link" id="auth-switch2">Masuk di sini</button>'
          : 'Belum punya akun? <button class="btn-link" id="auth-switch2">Daftar di sini</button>';
        document
          .getElementById("auth-switch2")
          .addEventListener("click", () => authSwitch.click());
        authError.textContent = "";
      });

      authSubmit.addEventListener("click", async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        authError.textContent = "";
        if (!email || !password) {
          authError.textContent = "Isi email dan kata sandi.";
          return;
        }
        try {
          if (isRegisterMode)
            await createUserWithEmailAndPassword(auth, email, password);
          else await signInWithEmailAndPassword(auth, email, password);
        } catch (err) {
          authError.textContent = translateAuthError(err.code);
        }
      });

      function translateAuthError(code) {
        const map = {
          "auth/email-already-in-use":
            "Email ini sudah terdaftar. Coba masuk saja.",
          "auth/invalid-email": "Format email tidak valid.",
          "auth/weak-password": "Kata sandi minimal 6 karakter.",
          "auth/user-not-found": "Akun tidak ditemukan. Coba daftar dulu.",
          "auth/wrong-password": "Kata sandi salah.",
          "auth/invalid-credential": "Email atau kata sandi salah.",
        };
        return map[code] || "Terjadi kesalahan. Coba lagi.";
      }

      document
        .getElementById("logout-btn-user")
        .addEventListener("click", () => signOut(auth));
      document
        .getElementById("logout-btn-admin")
        .addEventListener("click", () => signOut(auth));

      function showScreen(name) {
        authScreen.classList.add("hidden");
        appUser.style.display = "none";
        appAdmin.style.display = "none";
        if (name === "auth") {
          authScreen.classList.remove("hidden");
          return;
        }
        if (name === "user") appUser.style.display = "block";
        if (name === "admin") appAdmin.style.display = "block";
      }

      // ---------- Auth state ----------
      onAuthStateChanged(auth, async (user) => {
        if (unsubTasks) {
          unsubTasks();
          unsubTasks = null;
        }
        if (unsubUsers) {
          unsubUsers();
          unsubUsers = null;
        }

        if (!user) {
          showScreen("auth");
          return;
        }

        const profileRef = doc(db, "artifacts", APP_ID, "users", user.uid);
        let snap = await getDoc(profileRef);

        if (!snap.exists()) {
          await setDoc(profileRef, {
            email: user.email,
            role: "user",
            disabled: false,
            createdAt: serverTimestamp(),
            lastLoginAt: serverTimestamp(),
          });
          snap = await getDoc(profileRef);
        } else {
          await updateDoc(profileRef, { lastLoginAt: serverTimestamp() });
        }

        const profile = snap.data();
        if (profile.disabled) {
          alert("Akun Anda telah dinonaktifkan oleh admin.");
          await signOut(auth);
          return;
        }

        if (profile.role === "admin") {
          document.getElementById("admin-email-label").textContent = user.email;
          showScreen("admin");
          listenAdmin();
        } else {
          document.getElementById("user-email-label").textContent = user.email;
          showScreen("user");
          listenTasks(user.uid);
        }
      });

      // ---------- USER: tasks ----------
      function tasksCol(uid) {
        return collection(db, "artifacts", APP_ID, "users", uid, "tasks");
      }

      document
        .getElementById("add-task-btn")
        .addEventListener("click", async () => {
          const user = auth.currentUser;
          if (!user) return;
          const text = document.getElementById("new-task-text").value.trim();
          if (!text) return;
          const notes = document.getElementById("new-task-notes").value.trim();
          const priority = document.getElementById("new-task-priority").value;
          const deadlineVal =
            document.getElementById("new-task-deadline").value;
          const deadline = deadlineVal
            ? new Date(deadlineVal).toISOString()
            : null;

          await addDoc(tasksCol(user.uid), {
            text,
            notes,
            priority,
            deadline,
            completed: false,
            notified: false,
            createdAt: serverTimestamp(),
          });
          document.getElementById("new-task-text").value = "";
          document.getElementById("new-task-notes").value = "";
          document.getElementById("new-task-deadline").value = "";
        });

      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentTab = btn.dataset.tab;
          document
            .querySelectorAll(".tab-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          renderTasks();
        });
      });

      function listenTasks(uid) {
        unsubTasks = onSnapshot(query(tasksCol(uid)), (snapshot) => {
          cachedTasks = [];
          snapshot.forEach((d) => cachedTasks.push({ id: d.id, ...d.data() }));
          renderTasks();
        });
      }

      const priorityLabel = {
        urgent: "Sangat penting",
        important: "Penting",
        normal: "Biasa",
      };
      const priorityRank = { urgent: 0, important: 1, normal: 2 };

      function renderTasks() {
        const list = document.getElementById("task-list");
        const empty = document.getElementById("empty-state");
        list.innerHTML = "";

        const now = new Date();
        const filtered = cachedTasks.filter((t) =>
          currentTab === "aktif" ? !t.completed : t.completed,
        );
        filtered.sort((a, b) => {
          if (priorityRank[a.priority] !== priorityRank[b.priority])
            return priorityRank[a.priority] - priorityRank[b.priority];
          if (!a.deadline) return 1;
          if (!b.deadline) return -1;
          return new Date(a.deadline) - new Date(b.deadline);
        });

        empty.style.display = filtered.length === 0 ? "block" : "none";
        empty.textContent =
          currentTab === "aktif"
            ? "Belum ada tugas aktif."
            : "Belum ada tugas yang selesai.";

        document.getElementById("stat-aktif").textContent = cachedTasks.filter(
          (t) => !t.completed,
        ).length;
        document.getElementById("stat-selesai").textContent =
          cachedTasks.filter((t) => t.completed).length;
        document.getElementById("stat-lewat").textContent = cachedTasks.filter(
          (t) => !t.completed && t.deadline && new Date(t.deadline) < now,
        ).length;

        filtered.forEach((task) => {
          const el = document.createElement("div");
          el.className = "task" + (task.completed ? " done" : "");

          const top = document.createElement("div");
          top.className = "task-top";

          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !!task.completed;
          cb.addEventListener("change", () =>
            updateDoc(
              doc(
                db,
                "artifacts",
                APP_ID,
                "users",
                auth.currentUser.uid,
                "tasks",
                task.id,
              ),
              { completed: cb.checked },
            ),
          );

          const body = document.createElement("div");
          body.className = "task-body";
          const textEl = document.createElement("div");
          textEl.className = "task-text";
          textEl.textContent = task.text;
          body.appendChild(textEl);

          if (task.notes) {
            const n = document.createElement("div");
            n.className = "task-notes";
            n.textContent = task.notes;
            body.appendChild(n);
          }

          const meta = document.createElement("div");
          meta.className = "task-meta";
          const pill = document.createElement("span");
          pill.className = "priority-pill " + task.priority;
          pill.textContent = priorityLabel[task.priority] || "Biasa";
          meta.appendChild(pill);
          if (task.deadline) {
            const d = new Date(task.deadline);
            const overdue = !task.completed && d < now;
            const dEl = document.createElement("span");
            if (overdue) dEl.classList.add("overdue");
            dEl.textContent =
              (overdue ? "Lewat · " : "") +
              d.toLocaleString("id-ID", {
                dateStyle: "medium",
                timeStyle: "short",
              });
            meta.appendChild(dEl);
          }
          body.appendChild(meta);

          const actions = document.createElement("div");
          actions.className = "task-actions";
          const editBtn = document.createElement("button");
          editBtn.className = "icon-btn";
          editBtn.textContent = "Edit";
          editBtn.addEventListener("click", () => openEditModal(task));
          const delBtn = document.createElement("button");
          delBtn.className = "icon-btn danger";
          delBtn.textContent = "Hapus";
          delBtn.addEventListener("click", () => {
            if (confirm("Hapus tugas ini?"))
              deleteDoc(
                doc(
                  db,
                  "artifacts",
                  APP_ID,
                  "users",
                  auth.currentUser.uid,
                  "tasks",
                  task.id,
                ),
              );
          });
          actions.appendChild(editBtn);
          actions.appendChild(delBtn);
          body.appendChild(actions);

          top.appendChild(cb);
          top.appendChild(body);
          el.appendChild(top);
          list.appendChild(el);
        });
      }

      // ---------- Edit modal ----------
      const editOverlay = document.getElementById("edit-overlay");
      function openEditModal(task) {
        editingTaskId = task.id;
        document.getElementById("edit-text").value = task.text || "";
        document.getElementById("edit-notes").value = task.notes || "";
        document.getElementById("edit-priority").value =
          task.priority || "important";
        document.getElementById("edit-deadline").value = task.deadline
          ? new Date(task.deadline).toISOString().slice(0, 16)
          : "";
        editOverlay.classList.remove("hidden");
      }
      document
        .getElementById("edit-cancel")
        .addEventListener("click", () => editOverlay.classList.add("hidden"));
      document
        .getElementById("edit-save")
        .addEventListener("click", async () => {
          const text = document.getElementById("edit-text").value.trim();
          if (!text) return;
          const notes = document.getElementById("edit-notes").value.trim();
          const priority = document.getElementById("edit-priority").value;
          const deadlineVal = document.getElementById("edit-deadline").value;
          const deadline = deadlineVal
            ? new Date(deadlineVal).toISOString()
            : null;
          await updateDoc(
            doc(
              db,
              "artifacts",
              APP_ID,
              "users",
              auth.currentUser.uid,
              "tasks",
              editingTaskId,
            ),
            { text, notes, priority, deadline, notified: false },
          );
          editOverlay.classList.add("hidden");
        });

      // ---------- ADMIN ----------
      let cachedUsers = [];
      function listenAdmin() {
        unsubUsers = onSnapshot(
          collection(db, "artifacts", APP_ID, "users"),
          async (snapshot) => {
            cachedUsers = [];
            snapshot.forEach((d) =>
              cachedUsers.push({ id: d.id, ...d.data() }),
            );
            document.getElementById("admin-total-users").textContent =
              cachedUsers.length;

            const now = Date.now();
            const activeToday = cachedUsers.filter(
              (u) =>
                u.lastLoginAt &&
                now - u.lastLoginAt.toMillis() < 24 * 60 * 60 * 1000,
            ).length;
            document.getElementById("admin-active-today").textContent =
              activeToday;

            let totalTasks = 0;
            for (const u of cachedUsers) {
              const tSnap = await getDocs(tasksCol(u.id));
              totalTasks += tSnap.size;
            }
            document.getElementById("admin-total-tasks").textContent =
              totalTasks;

            renderUserTable();
          },
        );
      }

      document
        .getElementById("admin-search")
        .addEventListener("input", renderUserTable);

      function renderUserTable() {
        const term = document
          .getElementById("admin-search")
          .value.trim()
          .toLowerCase();
        const tbody = document.getElementById("user-table-body");
        tbody.innerHTML = "";
        cachedUsers
          .filter((u) => !term || (u.email || "").toLowerCase().includes(term))
          .sort(
            (a, b) =>
              (a.createdAt?.toMillis?.() || 0) -
              (b.createdAt?.toMillis?.() || 0),
          )
          .forEach((u) => {
            const tr = document.createElement("tr");
            const created = u.createdAt
              ? u.createdAt.toDate().toLocaleDateString("id-ID")
              : "-";
            const lastLogin = u.lastLoginAt
              ? u.lastLoginAt.toDate().toLocaleString("id-ID", {
                  dateStyle: "medium",
                  timeStyle: "short",
                })
              : "-";
            const statusHtml = u.disabled
              ? '<span class="status-pill disabled">Nonaktif</span>'
              : '<span class="status-pill active">Aktif</span>';

            tr.innerHTML = `<td>${u.email}${u.role === "admin" ? ' <span class="badge-role admin">ADMIN</span>' : ""}</td>
          <td>${created}</td><td>${lastLogin}</td><td>${statusHtml}</td><td></td>`;

            const actionTd = tr.lastElementChild;
            if (u.role !== "admin") {
              const toggleBtn = document.createElement("button");
              toggleBtn.className = "icon-btn" + (u.disabled ? "" : " danger");
              toggleBtn.textContent = u.disabled ? "Aktifkan" : "Nonaktifkan";
              toggleBtn.addEventListener("click", async () => {
                await updateDoc(doc(db, "artifacts", APP_ID, "users", u.id), {
                  disabled: !u.disabled,
                });
              });
              actionTd.appendChild(toggleBtn);
            } else {
              actionTd.textContent = "—";
            }
            tbody.appendChild(tr);
          });
      }
    </script>
  </body>
</html>
