<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugasku - Modern Task Manager</title>
    
    <!-- Google Fonts: Poppins for modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind Config to match Poppins font -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#eef2ff',
                100: '#e0e7ff',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
              }
            }
          }
        }
      }
    </script>

    <style>
      /* Custom utility classes */
      body {
        background-color: #f8fafc;
      }
      .hidden-important {
        display: none !important;
      }
      
      /* Smooth transitions */
      .task-card {
        transition: all 0.2s ease-in-out;
      }
      .task-card:hover {
        transform: translateY(-2px);
      }

      /* Custom Checkbox */
      input[type="checkbox"] {
        accent-color: #4f46e5;
        width: 1.25rem;
        height: 1.25rem;
        cursor: pointer;
      }

      /* Active Tab Styling */
      .tab-btn.active {
        color: #4f46e5;
        border-bottom-width: 2px;
        border-bottom-color: #4f46e5;
        font-weight: 600;
      }
      
      /* Hide apps initially */
      #app-user, #app-admin {
        display: none;
      }
    </style>
  </head>
  <body class="text-gray-800 antialiased min-h-screen">
    
    <!-- ===================== AUTH SCREEN ===================== -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-brand-50 to-blue-100">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-brand-100 text-brand-600 mb-4">
            <i class="fa-solid fa-check-double text-xl"></i>
          </div>
          <h1 class="text-2xl font-bold text-gray-900">Tugasku</h1>
          <p class="text-sm text-gray-500 mt-2" id="auth-tagline">
            Masuk untuk mengelola tugas dan deadline Anda.
          </p>
        </div>

        <div id="auth-error" class="text-red-500 text-sm font-medium mb-4 text-center min-h-[20px]"></div>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="email-input" autocomplete="email" 
                   class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all"
                   placeholder="nama@email.com" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Kata Sandi</label>
            <input type="password" id="password-input" autocomplete="current-password" 
                   class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all"
                   placeholder="••••••••" />
          </div>
          
          <button id="auth-submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg transition-colors shadow-md mt-2">
            Masuk
          </button>
        </div>

        <div class="mt-6 text-center text-sm text-gray-600" id="auth-toggle">
          Belum punya akun? 
          <button class="text-brand-600 font-semibold hover:underline" id="auth-switch">Daftar di sini</button>
        </div>
      </div>
    </div>

    <!-- ===================== USER APP ===================== -->
    <div id="app-user">
      <div class="max-w-2xl mx-auto px-4 py-8 md:py-12 pb-24">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-brand-100 flex items-center justify-center text-brand-600">
              <i class="fa-solid fa-user"></i>
            </div>
            <div>
              <h1 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                Tugasku
                <span class="bg-blue-100 text-blue-700 text-xs px-2.5 py-0.5 rounded-full font-bold">USER</span>
              </h1>
              <div class="text-sm text-gray-500" id="user-email-label"></div>
            </div>
          </div>
          <button id="logout-btn-user" class="text-gray-500 hover:text-red-500 text-sm font-medium transition-colors flex items-center gap-2">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar
          </button>
        </header>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-3 md:gap-4 mb-8">
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
            <div class="text-2xl font-bold text-brand-600" id="stat-aktif">0</div>
            <div class="text-xs text-gray-500 font-medium uppercase tracking-wide mt-1">Aktif</div>
          </div>
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
            <div class="text-2xl font-bold text-green-500" id="stat-selesai">0</div>
            <div class="text-xs text-gray-500 font-medium uppercase tracking-wide mt-1">Selesai</div>
          </div>
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
            <div class="text-2xl font-bold text-red-500" id="stat-lewat">0</div>
            <div class="text-xs text-gray-500 font-medium uppercase tracking-wide mt-1">Terlewat</div>
          </div>
        </div>

        <!-- Add Task Card -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-8">
          <h2 class="text-sm font-semibold text-gray-700 mb-3 uppercase tracking-wide">Buat Tugas Baru</h2>
          <input type="text" id="new-task-text" placeholder="Apa yang ingin Anda kerjakan?" 
                 class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none mb-3 bg-gray-50 text-sm" />
          
          <textarea id="new-task-notes" placeholder="Catatan tambahan (opsional)..." rows="2"
                    class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none mb-3 bg-gray-50 text-sm resize-none"></textarea>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
            <div>
              <label class="block text-xs text-gray-500 mb-1 ml-1">Prioritas</label>
              <select id="new-task-priority" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none bg-gray-50 text-sm appearance-none">
                <option value="urgent">🔴 Sangat penting</option>
                <option value="important" selected>🟠 Penting</option>
                <option value="normal">🟢 Biasa</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-gray-500 mb-1 ml-1">Tenggat Waktu</label>
              <input type="datetime-local" id="new-task-deadline" 
                     class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none bg-gray-50 text-sm" />
            </div>
          </div>
          
          <button id="add-task-btn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2">
            <i class="fa-solid fa-plus"></i> Tambah Tugas
          </button>
        </div>

        <!-- Tabs -->
        <div class="flex gap-2 mb-4 border-b border-gray-200">
          <button class="tab-btn active px-4 py-2 text-sm text-gray-500 transition-colors" data-tab="aktif">Tugas Aktif</button>
          <button class="tab-btn px-4 py-2 text-sm text-gray-500 transition-colors" data-tab="selesai">Selesai</button>
        </div>

        <!-- Task List -->
        <div id="task-list" class="space-y-3"></div>
        
        <!-- Empty State -->
        <div class="text-center py-12 px-4" id="empty-state">
          <div class="w-20 h-20 mx-auto bg-gray-100 rounded-full flex items-center justify-center text-gray-300 mb-3">
            <i class="fa-solid fa-clipboard-list text-3xl"></i>
          </div>
          <p class="text-gray-500 text-sm font-medium">Belum ada tugas di sini.</p>
        </div>
      </div>
    </div>

    <!-- ===================== ADMIN APP ===================== -->
    <div id="app-admin">
      <div class="max-w-4xl mx-auto px-4 py-8 md:py-12 pb-24">
        
        <!-- Admin Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center text-purple-600">
              <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div>
              <h1 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                Tugasku
                <span class="bg-purple-100 text-purple-700 text-xs px-2.5 py-0.5 rounded-full font-bold">ADMIN PANEL</span>
              </h1>
              <div class="text-sm text-gray-500" id="admin-email-label"></div>
            </div>
          </div>
          <button id="logout-btn-admin" class="text-gray-500 hover:text-red-500 text-sm font-medium transition-colors flex items-center gap-2">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar
          </button>
        </header>

        <!-- Admin Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-l-4 border-l-purple-500 border-y-gray-100 border-r-gray-100 flex items-center justify-between">
            <div>
              <div class="text-3xl font-bold text-gray-800" id="admin-total-users">0</div>
              <div class="text-xs text-gray-500 uppercase mt-1">Total Pengguna</div>
            </div>
            <i class="fa-solid fa-users text-gray-200 text-3xl"></i>
          </div>
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-l-4 border-l-brand-500 border-y-gray-100 border-r-gray-100 flex items-center justify-between">
            <div>
              <div class="text-3xl font-bold text-gray-800" id="admin-total-tasks">0</div>
              <div class="text-xs text-gray-500 uppercase mt-1">Total Tugas</div>
            </div>
            <i class="fa-solid fa-list-check text-gray-200 text-3xl"></i>
          </div>
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-l-4 border-l-green-500 border-y-gray-100 border-r-gray-100 flex items-center justify-between">
            <div>
              <div class="text-3xl font-bold text-gray-800" id="admin-active-today">0</div>
              <div class="text-xs text-gray-500 uppercase mt-1">Login Harian</div>
            </div>
            <i class="fa-solid fa-clock-rotate-left text-gray-200 text-3xl"></i>
          </div>
        </div>

        <!-- Admin Search & Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
          <div class="p-4 border-b border-gray-100 bg-gray-50">
            <div class="relative max-w-sm">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"></i>
              <input type="text" id="admin-search" placeholder="Cari email pengguna..." 
                     class="w-full pl-9 pr-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-purple-500 outline-none text-sm" />
            </div>
          </div>
          
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
              <thead>
                <tr class="bg-white text-gray-500 text-xs uppercase tracking-wide border-b border-gray-100">
                  <th class="py-3 px-4 font-semibold">Pengguna</th>
                  <th class="py-3 px-4 font-semibold">Tgl Daftar</th>
                  <th class="py-3 px-4 font-semibold">Login Terakhir</th>
                  <th class="py-3 px-4 font-semibold">Status</th>
                </tr>
              </thead>
              <tbody id="user-table-body" class="divide-y divide-gray-100">
                <!-- User rows injected by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- ===================== EDIT MODAL ===================== -->
    <div id="edit-overlay" class="hidden-important fixed inset-0 bg-gray-900 bg-opacity-50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 transform transition-all">
        <div class="flex justify-between items-center mb-5">
          <h3 class="text-lg font-bold text-gray-900">Edit Tugas</h3>
          <button id="edit-cancel-x" class="text-gray-400 hover:text-gray-600">
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
        </div>
        
        <input type="text" id="edit-text" placeholder="Nama tugas" 
               class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none mb-3 bg-gray-50 text-sm" />
        
        <textarea id="edit-notes" placeholder="Catatan (opsional)" rows="3"
                  class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none mb-3 bg-gray-50 text-sm resize-none"></textarea>
        
        <div class="grid grid-cols-2 gap-3 mb-5">
          <div>
            <label class="block text-xs text-gray-500 mb-1 ml-1">Prioritas</label>
            <select id="edit-priority" class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none bg-gray-50 text-sm appearance-none">
              <option value="urgent">🔴 Sangat penting</option>
              <option value="important">🟠 Penting</option>
              <option value="normal">🟢 Biasa</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1 ml-1">Tenggat</label>
            <input type="datetime-local" id="edit-deadline" 
                   class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none bg-gray-50 text-sm" />
          </div>
        </div>
        
        <div class="flex gap-3">
          <button id="edit-cancel" class="flex-1 bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium py-2.5 rounded-lg transition-colors text-sm">
            Batal
          </button>
          <button id="edit-save" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 rounded-lg transition-colors text-sm">
            Simpan Perubahan
          </button>
        </div>
      </div>
    </div>

    <!-- ===================== JAVASCRIPT ===================== -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
      import {
        getFirestore,
        collection,
        addDoc,
        onSnapshot,
        doc,
        updateDoc,
        deleteDoc,
        getDocs,
        getDoc,
        setDoc,
        query,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      // FIREBASE CONFIG ASLI ANDA (TIDAK DIUBAH)
      const firebaseConfig = {
        apiKey: "AIzaSyAa8NPTTgLAzHQkgvrzcFaNi2ZCpQ82kbE",
        authDomain: "tugas-saya-app.firebaseapp.com",
        projectId: "tugas-saya-app",
        storageBucket: "tugas-saya-app.firebasestorage.app",
        messagingSenderId: "59386857102",
        appId: "1:59386857102:web:d059f302249ac428b92bdf",
      };
      const APP_ID = "tugas-app-utama"; 

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let isRegisterMode = false;
      let unsubTasks = null;
      let unsubUsers = null;
      let currentTab = "aktif";
      let cachedTasks = [];
      let editingTaskId = null;

      // ---------- Elements ----------
      const authScreen = document.getElementById("auth-screen");
      const appUser = document.getElementById("app-user");
      const appAdmin = document.getElementById("app-admin");
      const authError = document.getElementById("auth-error");
      const emailInput = document.getElementById("email-input");
      const passwordInput = document.getElementById("password-input");
      const authSubmit = document.getElementById("auth-submit");
      const authSwitch = document.getElementById("auth-switch");
      const authToggle = document.getElementById("auth-toggle");
      const authTagline = document.getElementById("auth-tagline");

      authSwitch.addEventListener("click", () => {
        isRegisterMode = !isRegisterMode;
        authSubmit.textContent = isRegisterMode ? "Daftar Sekarang" : "Masuk";
        authTagline.textContent = isRegisterMode
          ? "Buat akun baru untuk mulai mengelola tugas Anda."
          : "Masuk untuk mengelola tugas dan deadline Anda.";
        authToggle.innerHTML = isRegisterMode
          ? 'Sudah punya akun? <button class="text-brand-600 font-semibold hover:underline" id="auth-switch2">Masuk di sini</button>'
          : 'Belum punya akun? <button class="text-brand-600 font-semibold hover:underline" id="auth-switch2">Daftar di sini</button>';
        document
          .getElementById("auth-switch2")
          .addEventListener("click", () => authSwitch.click());
        authError.textContent = "";
      });

      authSubmit.addEventListener("click", async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        authError.textContent = "";
        
        // Simple UI loading state
        const originalText = authSubmit.textContent;
        authSubmit.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses...';
        authSubmit.disabled = true;

        if (!email || !password) {
          authError.textContent = "Isi email dan kata sandi.";
          resetAuthBtn(originalText);
          return;
        }
        try {
          if (isRegisterMode)
            await createUserWithEmailAndPassword(auth, email, password);
          else await signInWithEmailAndPassword(auth, email, password);
        } catch (err) {
          authError.textContent = translateAuthError(err.code);
          resetAuthBtn(originalText);
        }
      });
      
      function resetAuthBtn(text) {
          authSubmit.textContent = text;
          authSubmit.disabled = false;
      }

      function translateAuthError(code) {
        const map = {
          "auth/email-already-in-use": "Email ini sudah terdaftar. Coba masuk saja.",
          "auth/invalid-email": "Format email tidak valid.",
          "auth/weak-password": "Kata sandi minimal 6 karakter.",
          "auth/user-not-found": "Akun tidak ditemukan. Coba daftar dulu.",
          "auth/wrong-password": "Kata sandi salah.",
          "auth/invalid-credential": "Email atau kata sandi salah.",
        };
        return map[code] || "Terjadi kesalahan. Coba lagi.";
      }

      document.getElementById("logout-btn-user").addEventListener("click", () => signOut(auth));
      document.getElementById("logout-btn-admin").addEventListener("click", () => signOut(auth));

      function showScreen(name) {
        authScreen.classList.add("hidden-important");
        appUser.style.display = "none";
        appAdmin.style.display = "none";
        if (name === "auth") {
          authScreen.classList.remove("hidden-important");
          return;
        }
        if (name === "user") appUser.style.display = "block";
        if (name === "admin") appAdmin.style.display = "block";
      }

      // ---------- Auth state ----------
      onAuthStateChanged(auth, async (user) => {
        if (unsubTasks) { unsubTasks(); unsubTasks = null; }
        if (unsubUsers) { unsubUsers(); unsubUsers = null; }

        if (!user) {
          showScreen("auth");
          return;
        }

        const profileRef = doc(db, "artifacts", APP_ID, "users", user.uid);
        let snap = await getDoc(profileRef);

        if (!snap.exists()) {
          await setDoc(profileRef, {
            email: user.email,
            role: "user",
            disabled: false,
            createdAt: serverTimestamp(),
            lastLoginAt: serverTimestamp(),
          });
          snap = await getDoc(profileRef);
        } else {
          await updateDoc(profileRef, { lastLoginAt: serverTimestamp() });
        }

        const profile = snap.data();
        if (profile.disabled) {
          alert("Akun Anda telah dinonaktifkan oleh admin.");
          await signOut(auth);
          return;
        }

        if (profile.role === "admin") {
          document.getElementById("admin-email-label").textContent = user.email;
          showScreen("admin");
          listenAdmin();
        } else {
          document.getElementById("user-email-label").textContent = user.email;
          showScreen("user");
          listenTasks(user.uid);
        }
      });

      // ---------- USER: tasks ----------
      function tasksCol(uid) {
        return collection(db, "artifacts", APP_ID, "users", uid, "tasks");
      }

      document.getElementById("add-task-btn").addEventListener("click", async () => {
        const user = auth.currentUser;
        if (!user) return;
        const textInput = document.getElementById("new-task-text");
        const text = textInput.value.trim();
        if (!text) return;
        
        const notes = document.getElementById("new-task-notes").value.trim();
        const priority = document.getElementById("new-task-priority").value;
        const deadlineVal = document.getElementById("new-task-deadline").value;
        const deadline = deadlineVal ? new Date(deadlineVal).toISOString() : null;

        await addDoc(tasksCol(user.uid), {
          text,
          notes,
          priority,
          deadline,
          completed: false,
          notified: false,
          createdAt: serverTimestamp(),
        });
        
        textInput.value = "";
        document.getElementById("new-task-notes").value = "";
        document.getElementById("new-task-deadline").value = "";
      });

      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentTab = btn.dataset.tab;
          document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          renderTasks();
        });
      });

      function listenTasks(uid) {
        unsubTasks = onSnapshot(query(tasksCol(uid)), (snapshot) => {
          cachedTasks = [];
          snapshot.forEach((d) => cachedTasks.push({ id: d.id, ...d.data() }));
          renderTasks();
        });
      }

      const priorityStyle = {
        urgent: { label: "Sangat penting", class: "bg-red-100 text-red-700" },
        important: { label: "Penting", class: "bg-orange-100 text-orange-700" },
        normal: { label: "Biasa", class: "bg-green-100 text-green-700" },
      };
      const priorityRank = { urgent: 0, important: 1, normal: 2 };

      function renderTasks() {
        const list = document.getElementById("task-list");
        const empty = document.getElementById("empty-state");
        list.innerHTML = "";

        const now = new Date();
        const filtered = cachedTasks.filter((t) =>
          currentTab === "aktif" ? !t.completed : t.completed,
        );
        filtered.sort((a, b) => {
          if (priorityRank[a.priority] !== priorityRank[b.priority])
            return priorityRank[a.priority] - priorityRank[b.priority];
          if (!a.deadline) return 1;
          if (!b.deadline) return -1;
          return new Date(a.deadline) - new Date(b.deadline);
        });

        empty.style.display = filtered.length === 0 ? "block" : "none";
        empty.querySelector('p').textContent =
          currentTab === "aktif"
            ? "Belum ada tugas aktif. Mari buat satu!"
            : "Belum ada tugas yang selesai.";

        document.getElementById("stat-aktif").textContent = cachedTasks.filter((t) => !t.completed).length;
        document.getElementById("stat-selesai").textContent = cachedTasks.filter((t) => t.completed).length;
        document.getElementById("stat-lewat").textContent = cachedTasks.filter((t) => !t.completed && t.deadline && new Date(t.deadline) < now).length;

        filtered.forEach((task) => {
          const el = document.createElement("div");
          // TAILWIND STYLING FOR TASK CARDS
          el.className = "task-card bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex gap-3 " + (task.completed ? "opacity-60 bg-gray-50" : "");

          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !!task.completed;
          cb.className = "mt-1 shrink-0";
          cb.addEventListener("change", () =>
            updateDoc(doc(db, "artifacts", APP_ID, "users", auth.currentUser.uid, "tasks", task.id), { completed: cb.checked })
          );
          el.appendChild(cb);

          const body = document.createElement("div");
          body.className = "flex-1 min-w-0";

          const textEl = document.createElement("div");
          textEl.className = "text-sm md:text-base font-medium break-words " + (task.completed ? "line-through text-gray-500" : "text-gray-800");
          textEl.textContent = task.text;
          body.appendChild(textEl);

          if (task.notes) {
            const n = document.createElement("div");
            n.className = "text-xs md:text-sm text-gray-500 mt-1 whitespace-pre-wrap";
            n.textContent = task.notes;
            body.appendChild(n);
          }

          const meta = document.createElement("div");
          meta.className = "flex flex-wrap items-center gap-2 mt-3 text-xs";
          
          const pStyle = priorityStyle[task.priority] || priorityStyle.normal;
          const pill = document.createElement("span");
          pill.className = `font-semibold px-2 py-0.5 rounded-full ${pStyle.class}`;
          pill.textContent = pStyle.label;
          meta.appendChild(pill);

          if (task.deadline) {
            const d = new Date(task.deadline);
            const overdue = !task.completed && d < now;
            const dEl = document.createElement("span");
            dEl.className = "flex items-center gap-1 text-gray-500 " + (overdue ? "text-red-600 font-bold" : "");
            dEl.innerHTML = `<i class="fa-regular fa-clock"></i> ` + 
              (overdue ? "Lewat · " : "") +
              d.toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });
            meta.appendChild(dEl);
          }
          body.appendChild(meta);
          el.appendChild(body);

          const actions = document.createElement("div");
          actions.className = "flex flex-col md:flex-row gap-2 ml-2";
          
          const editBtn = document.createElement("button");
          editBtn.className = "w-8 h-8 rounded-lg text-gray-400 hover:text-brand-600 hover:bg-brand-50 transition-colors flex items-center justify-center";
          editBtn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i>';
          editBtn.addEventListener("click", () => openEditModal(task));
          
          const delBtn = document.createElement("button");
          delBtn.className = "w-8 h-8 rounded-lg text-gray-400 hover:text-red-600 hover:bg-red-50 transition-colors flex items-center justify-center";
          delBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
          delBtn.addEventListener("click", () => {
            if (confirm("Hapus tugas ini?"))
              deleteDoc(doc(db, "artifacts", APP_ID, "users", auth.currentUser.uid, "tasks", task.id));
          });

          actions.appendChild(editBtn);
          actions.appendChild(delBtn);
          el.appendChild(actions);

          list.appendChild(el);
        });
      }

      // ---------- Edit modal ----------
      const editOverlay = document.getElementById("edit-overlay");
      
      function openEditModal(task) {
        editingTaskId = task.id;
        document.getElementById("edit-text").value = task.text || "";
        document.getElementById("edit-notes").value = task.notes || "";
        document.getElementById("edit-priority").value = task.priority || "important";
        document.getElementById("edit-deadline").value = task.deadline
          ? new Date(task.deadline).toISOString().slice(0, 16)
          : "";
        editOverlay.classList.remove("hidden-important");
      }
      
      const closeEdit = () => editOverlay.classList.add("hidden-important");
      document.getElementById("edit-cancel").addEventListener("click", closeEdit);
      document.getElementById("edit-cancel-x").addEventListener("click", closeEdit);
      
      document.getElementById("edit-save").addEventListener("click", async () => {
        const text = document.getElementById("edit-text").value.trim();
        if (!text) return;
        const notes = document.getElementById("edit-notes").value.trim();
        const priority = document.getElementById("edit-priority").value;
        const deadlineVal = document.getElementById("edit-deadline").value;
        const deadline = deadlineVal ? new Date(deadlineVal).toISOString() : null;
        
        await updateDoc(
          doc(db, "artifacts", APP_ID, "users", auth.currentUser.uid, "tasks", editingTaskId),
          { text, notes, priority, deadline, notified: false }
        );
        closeEdit();
      });

      // ---------- ADMIN ----------
      let cachedUsers = [];
      function listenAdmin() {
        unsubUsers = onSnapshot(
          collection(db, "artifacts", APP_ID, "users"),
          async (snapshot) => {
            cachedUsers = [];
            snapshot.forEach((d) => cachedUsers.push({ id: d.id, ...d.data() }));
            
            document.getElementById("admin-total-users").textContent = cachedUsers.length;

            const now = Date.now();
            const activeToday = cachedUsers.filter(
              (u) => u.lastLoginAt && now - u.lastLoginAt.toMillis() < 24 * 60 * 60 * 1000
            ).length;
            document.getElementById("admin-active-today").textContent = activeToday;

            let totalTasks = 0;
            for (const u of cachedUsers) {
              const tSnap = await getDocs(tasksCol(u.id));
              totalTasks += tSnap.size;
            }
            document.getElementById("admin-total-tasks").textContent = totalTasks;

            renderUserTable();
          }
        );
      }

      document.getElementById("admin-search").addEventListener("input", renderUserTable);

      function renderUserTable() {
        const term = document.getElementById("admin-search").value.trim().toLowerCase();
        const tbody = document.getElementById("user-table-body");
        tbody.innerHTML = "";
        
        cachedUsers
          .filter((u) => !term || (u.email || "").toLowerCase().includes(term))
          // Melengkapi kode JS yang sebelumnya terpotong di prompt Anda:
          .sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0))
          .forEach((u) => {
            const tr = document.createElement("tr");
            tr.className = "hover:bg-gray-50 transition-colors";
            
            // Email col
            const tdEmail = document.createElement("td");
            tdEmail.className = "py-3 px-4 font-medium text-gray-800";
            tdEmail.textContent = u.email || "-";
            
            // Registered col
            const tdReg = document.createElement("td");
            tdReg.className = "py-3 px-4 text-gray-500 text-sm";
            tdReg.textContent = u.createdAt ? new Date(u.createdAt.toDate()).toLocaleDateString('id-ID') : "-";
            
            // Login col
            const tdLog = document.createElement("td");
            tdLog.className = "py-3 px-4 text-gray-500 text-sm";
            tdLog.textContent = u.lastLoginAt ? new Date(u.lastLoginAt.toDate()).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' }) : "-";
            
            // Status col
            const tdStat = document.createElement("td");
            tdStat.className = "py-3 px-4";
            const statSpan = document.createElement("span");
            if(u.disabled) {
                statSpan.className = "bg-red-100 text-red-700 text-xs px-2 py-1 rounded-full font-semibold";
                statSpan.textContent = "Dinonaktifkan";
            } else {
                statSpan.className = "bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full font-semibold";
                statSpan.textContent = "Aktif";
            }
            tdStat.appendChild(statSpan);

            tr.appendChild(tdEmail);
            tr.appendChild(tdReg);
            tr.appendChild(tdLog);
            tr.appendChild(tdStat);
            tbody.appendChild(tr);
          });
      }
    </script>
  </body>
</html>
